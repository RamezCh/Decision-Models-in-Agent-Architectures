<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="#fcfcfb"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#0b0b0b">A chatbot writes. A System One model picks.</text>
  <text x="30" y="64" font-size="13.5" fill="#52514e">Same support ticket, two kinds of model (after Kahneman: System 2 = slow and deliberate, System 1 = fast and automatic).</text>

  <!-- LLM row -->
  <text x="30" y="108" font-size="13" font-weight="700" fill="#6b6a66" letter-spacing=".06em">SYSTEM 2 · LLM</text>
  <rect x="30" y="120" width="180" height="70" rx="10" fill="#fff" stroke="#d3d9e2"/>
  <text x="120" y="150" font-size="12.5" text-anchor="middle" fill="#0b0b0b">"I was charged twice</text>
  <text x="120" y="168" font-size="12.5" text-anchor="middle" fill="#0b0b0b">this month…"</text>
  <path d="M210,155 H245" stroke="#52514e" stroke-width="1.6" marker-end="url(#a)"/>
  <g font-size="12" fill="#0b0b0b">
    <rect x="250" y="136" width="64" height="38" rx="6" fill="#f1f0ec"/><text x="282" y="160" text-anchor="middle">{"team"</text>
    <rect x="320" y="136" width="56" height="38" rx="6" fill="#f1f0ec"/><text x="348" y="160" text-anchor="middle">: "bill</text>
    <rect x="382" y="136" width="56" height="38" rx="6" fill="#f1f0ec"/><text x="410" y="160" text-anchor="middle">ing",</text>
    <rect x="444" y="136" width="70" height="38" rx="6" fill="#f1f0ec"/><text x="479" y="160" text-anchor="middle">"urgent</text>
    <rect x="520" y="136" width="40" height="38" rx="6" fill="#f1f0ec"/><text x="540" y="160" text-anchor="middle">…</text>
  </g>
  <text x="250" y="200" font-size="12" fill="#52514e">one token after another; the JSON can break, any word can come out</text>
  <path d="M565,155 H600" stroke="#52514e" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="605" y="120" width="325" height="70" rx="10" fill="#fff" stroke="#d3d9e2"/>
  <text x="620" y="148" font-size="12.5" fill="#0b0b0b">text you still have to parse and check</text>
  <text x="620" y="170" font-size="12" fill="#52514e">seconds, cost grows with every output token</text>

  <!-- System One row -->
  <text x="30" y="250" font-size="13" font-weight="700" fill="#6b6a66" letter-spacing=".06em">SYSTEM 1 · JEV / CLM</text>
  <rect x="30" y="262" width="190" height="110" rx="10" fill="#fff" stroke="#d3d9e2"/>
  <text x="44" y="286" font-size="11.5" font-weight="700" fill="#2a78d6">STATE</text>
  <text x="44" y="304" font-size="12" fill="#0b0b0b">"I was charged twice…"</text>
  <text x="44" y="328" font-size="11.5" font-weight="700" fill="#2a78d6">TYPED QUESTIONS</text>
  <text x="44" y="346" font-size="12" fill="#0b0b0b">refund?  noul (yes/no)</text>
  <text x="44" y="362" font-size="12" fill="#0b0b0b">team? choice · urgency? score</text>
  <path d="M220,317 H245" stroke="#52514e" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="250" y="282" width="310" height="70" rx="10" fill="#eef4fc" stroke="#2a78d6"/>
  <text x="405" y="310" font-size="13" font-weight="700" text-anchor="middle" fill="#0b0b0b">one pass, all questions in parallel</text>
  <text x="405" y="332" font-size="12" text-anchor="middle" fill="#52514e">probability spread over the allowed answers only</text>
  <path d="M560,317 H600" stroke="#52514e" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="605" y="262" width="325" height="110" rx="10" fill="#fff" stroke="#d3d9e2"/>
  <g font-size="12.5" fill="#0b0b0b">
    <text x="620" y="290">refund: <tspan font-weight="700">0.90</tspan></text>
    <text x="620" y="312">team: <tspan font-weight="700">billing 0.85</tspan> · technical 0.13 · sales 0.02</text>
    <text x="620" y="334">urgency: <tspan font-weight="700">2 of 3</tspan></text>
  </g>
  <text x="620" y="358" font-size="12" fill="#52514e">~100 ms · can't break the format · can still be wrong</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
