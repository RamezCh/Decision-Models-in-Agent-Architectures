<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#fcfcfb"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#0b0b0b">How CLM-8B answers one yes/no question</text>
  <text x="30" y="64" font-size="13.5" fill="#52514e">It never writes text. It turns the situation and each possible answer into vectors and picks the closest one.</text>

  <!-- step labels -->
  <g font-size="12" font-weight="700" fill="#6b6a66" letter-spacing=".06em">
    <text x="30" y="104">1  WHAT IT READS</text>
    <text x="330" y="104">2  ENCODE (frozen Qwen3-8B + small trained heads)</text>
    <text x="735" y="104">3  COMPARE</text>
  </g>

  <!-- state text -->
  <rect x="30" y="118" width="270" height="150" rx="10" fill="#fff" stroke="#d3d9e2"/>
  <text x="44" y="140" font-size="12" font-weight="700" fill="#2a78d6">STATE TEXT  (context + question)</text>
  <g font-size="12.5" fill="#0b0b0b">
    <text x="44" y="164">title: Sunny flat, quiet street</text>
    <text x="44" y="182">rent_eur: 510 · size_m2: 70</text>
    <text x="44" y="200">text: "I'm abroad, pay the deposit</text>
    <text x="44" y="218">  via Western Union, keys by post"</text>
    <text x="44" y="246" font-weight="700">Is money requested before a viewing?</text>
  </g>

  <!-- candidates -->
  <rect x="30" y="290" width="270" height="78" rx="10" fill="#fff" stroke="#d3d9e2"/>
  <text x="44" y="312" font-size="12" font-weight="700" fill="#1baf7a">CANDIDATE "true"</text>
  <text x="44" y="334" font-size="12.5" fill="#0b0b0b">true: The landlord asks for a deposit</text>
  <text x="44" y="352" font-size="12.5" fill="#0b0b0b">or rent before anyone has seen the flat.</text>
  <rect x="30" y="380" width="270" height="78" rx="10" fill="#fff" stroke="#d3d9e2"/>
  <text x="44" y="402" font-size="12" font-weight="700" fill="#eb6834">CANDIDATE "false"</text>
  <text x="44" y="424" font-size="12.5" fill="#0b0b0b">false: Money is only paid after a</text>
  <text x="44" y="442" font-size="12.5" fill="#0b0b0b">viewing and a signed contract.</text>

  <!-- encoders -->
  <rect x="345" y="150" width="170" height="86" rx="10" fill="#eef4fc" stroke="#2a78d6"/>
  <text x="430" y="182" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">Qwen3-8B</text>
  <text x="430" y="200" font-size="12" fill="#52514e" text-anchor="middle">last-token hidden state</text>
  <text x="430" y="222" font-size="12.5" font-weight="700" fill="#2a78d6" text-anchor="middle">→ state head</text>
  <rect x="345" y="330" width="170" height="86" rx="10" fill="#fdf1eb" stroke="#eb6834"/>
  <text x="430" y="362" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">Qwen3-8B</text>
  <text x="430" y="380" font-size="12" fill="#52514e" text-anchor="middle">same frozen backbone</text>
  <text x="430" y="402" font-size="12.5" font-weight="700" fill="#eb6834" text-anchor="middle">→ action head</text>

  <path d="M300,193 H340" stroke="#52514e" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M300,329 C322,329 322,373 340,373" stroke="#52514e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M300,419 C322,419 322,373 340,373" stroke="#52514e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <!-- vectors -->
  <g font-size="12.5" fill="#0b0b0b">
    <text x="540" y="176">s = vector</text>
    <text x="540" y="194" fill="#52514e" font-size="11.5">(the situation)</text>
    <text x="540" y="358">a_true, a_false</text>
    <text x="540" y="376" fill="#52514e" font-size="11.5">(one vector per answer,</text>
    <text x="540" y="392" fill="#52514e" font-size="11.5">cacheable: they never change)</text>
  </g>
  <path d="M515,193 H530" stroke="#52514e" stroke-width="1.6"/>
  <path d="M515,373 H530" stroke="#52514e" stroke-width="1.6"/>

  <!-- embedding space -->
  <rect x="735" y="118" width="200" height="200" rx="10" fill="#fff" stroke="#d3d9e2"/>
  <circle cx="790" cy="263" r="3" fill="#52514e"/>
  <path d="M790,263 L890,168" stroke="#2a78d6" stroke-width="2.4" marker-end="url(#a)"/>
  <path d="M790,263 L905,195" stroke="#1baf7a" stroke-width="2.4" marker-end="url(#a)"/>
  <path d="M790,263 L800,140" stroke="#eb6834" stroke-width="2.4" marker-end="url(#a)"/>
  <text x="866" y="160" font-size="12" font-weight="700" fill="#2a78d6">s</text>
  <text x="893" y="216" font-size="12" font-weight="700" fill="#1baf7a">true</text>
  <text x="806" y="140" font-size="12" font-weight="700" fill="#eb6834">false</text>
  <path d="M826,229 A50,50 0 0,1 836,236" stroke="#0b0b0b" stroke-width="1.2" fill="none"/>
  <text x="749" y="300" font-size="11.5" fill="#52514e">small angle = high cosine</text>

  <!-- maths -->
  <rect x="580" y="430" width="355" height="104" rx="10" fill="#fff" stroke="#d3d9e2"/>
  <text x="596" y="454" font-size="12" font-weight="700" fill="#6b6a66" letter-spacing=".06em">4  SCORE  →  PROBABILITY</text>
  <text x="596" y="478" font-size="13" fill="#0b0b0b">logit_i = scale × cos(s, a_i)    (scale ≤ 100)</text>
  <text x="596" y="500" font-size="13" fill="#0b0b0b">P(i) = softmax over the candidates</text>
  <text x="596" y="522" font-size="13" font-weight="700" fill="#0b0b0b">e.g. cos .41 vs .37, scale 50 → P(true) = 88%</text>

  <path d="M835,318 V425" stroke="#52514e" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="30" y="500" font-size="12.5" fill="#52514e">Training (InfoNCE) pulled each situation towards the answer that was right and away</text>
  <text x="30" y="518" font-size="12.5" fill="#52514e">from the others: 60M Q&amp;A pairs, 30M hard negatives, 1M agent trajectories.</text>
  <text x="30" y="536" font-size="12.5" fill="#52514e">Only the two ~20M-parameter heads were trained; the 8B backbone stays frozen.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
