<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#fcfcfb"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#0b0b0b">Why the yes/no descriptions matter</text>
  <text x="30" y="64" font-size="13.5" fill="#52514e">CLM compares the situation with the text of each answer. If the two answer texts are nearly the same, so are their vectors.</text>

  <!-- left -->
  <rect x="30" y="86" width="440" height="310" rx="12" fill="#fff" stroke="#d3d9e2"/>
  <text x="50" y="114" font-size="14" font-weight="700" fill="#0b0b0b">Without descriptions (CLM's default)</text>
  <text x="50" y="140" font-size="12" fill="#1baf7a" font-weight="700">true:</text>
  <text x="88" y="140" font-size="12" fill="#0b0b0b">Yes. This is true: The landlord asks for money…</text>
  <text x="50" y="160" font-size="12" fill="#eb6834" font-weight="700">false:</text>
  <text x="92" y="160" font-size="12" fill="#0b0b0b">No. This is false: The landlord asks for money…</text>
  <circle cx="120" cy="350" r="3" fill="#52514e"/>
  <path d="M120,350 L330,215" stroke="#1baf7a" stroke-width="2.4" marker-end="url(#a)"/>
  <path d="M120,350 L338,226" stroke="#eb6834" stroke-width="2.4" marker-end="url(#a)"/>
  <path d="M120,350 L300,190" stroke="#2a78d6" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="304" y="184" font-size="12" font-weight="700" fill="#2a78d6">situation</text>
  <text x="340" y="212" font-size="12" font-weight="700" fill="#1baf7a">true</text>
  <text x="346" y="238" font-size="12" font-weight="700" fill="#eb6834">false</text>
  <text x="200" y="380" font-size="13" fill="#0b0b0b" font-weight="700">→ almost the same cosine → about 50/50</text>

  <!-- right -->
  <rect x="490" y="86" width="440" height="310" rx="12" fill="#fff" stroke="#d3d9e2"/>
  <text x="510" y="114" font-size="14" font-weight="700" fill="#0b0b0b">With descriptions (what the demos send)</text>
  <text x="510" y="140" font-size="12" fill="#1baf7a" font-weight="700">true:</text>
  <text x="548" y="140" font-size="12" fill="#0b0b0b">Asks for a deposit before anyone has seen it.</text>
  <text x="510" y="160" font-size="12" fill="#eb6834" font-weight="700">false:</text>
  <text x="552" y="160" font-size="12" fill="#0b0b0b">Money only after a viewing and a contract.</text>
  <circle cx="580" cy="350" r="3" fill="#52514e"/>
  <path d="M580,350 L800,225" stroke="#1baf7a" stroke-width="2.4" marker-end="url(#a)"/>
  <path d="M580,350 L620,185" stroke="#eb6834" stroke-width="2.4" marker-end="url(#a)"/>
  <path d="M580,350 L780,205" stroke="#2a78d6" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="742" y="196" font-size="12" font-weight="700" fill="#2a78d6">situation</text>
  <text x="806" y="232" font-size="12" font-weight="700" fill="#1baf7a">true</text>
  <text x="590" y="180" font-size="12" font-weight="700" fill="#eb6834">false</text>
  <text x="650" y="380" font-size="13" fill="#0b0b0b" font-weight="700">→ clearly closer to one → a real answer</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
