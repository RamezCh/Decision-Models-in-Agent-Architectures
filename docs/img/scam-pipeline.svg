<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#fcfcfb"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#0b0b0b">From a flat listing to "Likely scam"</text>
  <text x="30" y="64" font-size="13.5" fill="#52514e">The model only answers small questions. Plain, inspectable code turns the answers into a decision.</text>

  <rect x="30" y="96" width="150" height="120" rx="10" fill="#fff" stroke="#d3d9e2"/>
  <text x="105" y="126" font-size="14" font-weight="700" text-anchor="middle" fill="#0b0b0b">Listing</text>
  <text x="105" y="150" font-size="12" text-anchor="middle" fill="#52514e">title, district,</text>
  <text x="105" y="168" font-size="12" text-anchor="middle" fill="#52514e">rent, size, text,</text>
  <text x="105" y="186" font-size="12" text-anchor="middle" fill="#52514e">landlord messages</text>

  <rect x="220" y="86" width="230" height="300" rx="10" fill="#eef4fc" stroke="#2a78d6"/>
  <text x="335" y="112" font-size="14" font-weight="700" text-anchor="middle" fill="#0b0b0b">CLM-8B · one request</text>
  <text x="335" y="130" font-size="11.5" text-anchor="middle" fill="#52514e">10 yes/no questions, each with</text>
  <text x="335" y="145" font-size="11.5" text-anchor="middle" fill="#52514e">a "yes" and a "no" description</text>
  <g font-size="12" fill="#0b0b0b">
    <text x="236" y="174">Money before viewing?</text><text x="434" y="174" text-anchor="end" font-weight="700">0.70</text>
    <text x="236" y="196">Landlord can't show it?</text><text x="434" y="196" text-anchor="end" font-weight="700">0.39</text>
    <text x="236" y="218">Keys by post?</text><text x="434" y="218" text-anchor="end" font-weight="700">0.63</text>
    <text x="236" y="240">Moves to WhatsApp?</text><text x="434" y="240" text-anchor="end" font-weight="700">0.68</text>
    <text x="236" y="262">Suspiciously cheap?</text><text x="434" y="262" text-anchor="end" font-weight="700">0.18</text>
    <text x="236" y="284">Wants ID early?</text><text x="434" y="284" text-anchor="end" font-weight="700">0.86</text>
    <text x="236" y="306">…3 more red flags</text><text x="434" y="306" text-anchor="end" font-weight="700">…</text>
    <text x="236" y="336" font-weight="700">One big question: scam?</text><text x="434" y="336" text-anchor="end" font-weight="700">0.96</text>
  </g>
  <text x="335" y="368" font-size="11.5" text-anchor="middle" fill="#52514e">raw scores: they rank well but sit high</text>

  <rect x="490" y="136" width="210" height="200" rx="10" fill="#fff" stroke="#d3d9e2"/>
  <text x="595" y="162" font-size="14" font-weight="700" text-anchor="middle" fill="#0b0b0b">Calibration (code)</text>
  <text x="595" y="184" font-size="12" text-anchor="middle" fill="#52514e">logistic regression fitted</text>
  <text x="595" y="200" font-size="12" text-anchor="middle" fill="#52514e">on 30 labelled listings</text>
  <text x="506" y="232" font-size="12.5" fill="#0b0b0b">z_k = standardise(logit p_k)</text>
  <text x="506" y="256" font-size="12.5" fill="#0b0b0b">risk = σ(b + Σ w_k · z_k)</text>
  <text x="506" y="286" font-size="11.5" fill="#52514e">each w_k·z_k is shown in the</text>
  <text x="506" y="302" font-size="11.5" fill="#52514e">app as "+1.3 towards scam"</text>

  <rect x="730" y="136" width="210" height="200" rx="10" fill="#fff" stroke="#d3d9e2"/>
  <text x="835" y="162" font-size="14" font-weight="700" text-anchor="middle" fill="#0b0b0b">Decision (code)</text>
  <rect x="745" y="180" width="180" height="34" rx="6" fill="#e7f3ea"/>
  <text x="755" y="202" font-size="12.5" fill="#1d7a3a" font-weight="700">risk &lt; 30%  Looks OK</text>
  <rect x="745" y="222" width="180" height="34" rx="6" fill="#fbf0dc"/>
  <text x="755" y="244" font-size="12.5" fill="#99600a" font-weight="700">30–60%  Check manually</text>
  <rect x="745" y="264" width="180" height="34" rx="6" fill="#fbe5e4"/>
  <text x="755" y="286" font-size="12.5" fill="#b42828" font-weight="700">≥ 60%  Likely scam</text>

  <path d="M180,156 H214" stroke="#52514e" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M450,236 H484" stroke="#52514e" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M700,236 H724" stroke="#52514e" stroke-width="1.6" marker-end="url(#a)"/>

  <text x="30" y="420" font-size="12.5" fill="#52514e">Why not just trust "scam? 0.96"? Raw CLM scores rank listings well but are shifted: legit listings also got 85–98%.</text>
  <text x="30" y="440" font-size="12.5" fill="#52514e">Calibration maps them back to honest percentages, and the per-question pushes make every decision explainable.</text>
  <text x="30" y="460" font-size="11.5" fill="#6b6a66">Example numbers: real CLM answers for listing s01 from the diagnosis run.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
